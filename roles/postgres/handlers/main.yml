---
- name: daemon reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart postgres
  ansible.builtin.systemd:
    name: postgres
    state: restarted

- name: reload postgres
  ansible.builtin.systemd:
    name: postgres
    state: reloaded

- name: restart exporter
  ansible.builtin.systemd:
    name: postgres-exporter
    state: restarted
