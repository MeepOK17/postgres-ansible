---
postgres__data_dir: /data/postgres/data

postgres__opts:
  listen_addresses: "'localhost'"
  port: 5432
  max_connections: 100

postgres__hba:
  - { type: local, database: all, user: postgres, method: peer }
  - { type: local, database: all, user: all, method: peer }
  - { type: host, database: all, user: all, address: 127.0.0.1/32, method: scram-sha-256 }
  - { type: host, database: all, user: all, address: "::1/128", method: scram-sha-256 }

postgres__databases: []
postgres__users: []

postgres__exporter_version: "0.16.0"
postgres__exporter_user: postgres_exporter
postgres__exporter_password: ""
postgres__exporter_port: 9187
