- name: Install packages
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Stop default cluster
  ansible.builtin.systemd:
    name: "postgresql@{{ __pg_version }}-main"
    state: stopped

- name: Disable default postgresql service
  ansible.builtin.systemd:
    name: postgresql
    state: stopped
    enabled: false

- name: Create /data
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create postgres dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - "{{ postgres__data_dir | dirname }}"
    - "{{ postgres__data_dir }}"

- name: Init database cluster
  ansible.builtin.command:
    cmd: "{{ __pg_bin }}/pg_ctl initdb -D {{ postgres__data_dir }}"
    creates: "{{ postgres__data_dir }}/PG_VERSION"
    chdir: /tmp
  become_user: postgres

- name: Set postgresql.conf options
  ansible.builtin.lineinfile:
    path: "{{ postgres__data_dir }}/postgresql.conf"
    regexp: "^#?{{ item.key | regex_escape() }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ postgres__opts | dict2items }}"
  notify: restart postgres

- name: Set pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres__data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: reload postgres

- name: Postgres unit file
  ansible.builtin.template:
    src: postgres.service.j2
    dest: /etc/systemd/system/postgres.service
    mode: "0644"
  notify:
    - daemon reload
    - restart postgres

- name: Run handlers
  ansible.builtin.meta: flush_handlers

- name: Start postgres
  ansible.builtin.systemd:
    name: postgres
    state: started
    enabled: true

- name: Check SELECT 1
  ansible.builtin.command: psql -tAc "SELECT 1"
  become_user: postgres
  register: select_one
  changed_when: false

- name: Show SELECT 1 result
  ansible.builtin.debug:
    var: select_one.stdout
